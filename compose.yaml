name: pactor

x-app: &app
  image: pactor:local
  build:
    context: .
  env_file: .env
  environment: &app-env
    POSTGRES_USER: pactor_app
    POSTGRES_PASSWORD: ${PACTOR_APP_PASSWORD}
  volumes:
    - media:/srv/pactor/media
  depends_on:
    migrate:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.12-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      PACTOR_OWNER_PASSWORD: ${PACTOR_OWNER_PASSWORD}
      PACTOR_APP_PASSWORD: ${PACTOR_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pactor"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: pactor
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.2.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  clamav:
    image: clamav/clamav:1.4.7-debian13-slim
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  migrate:
    image: pactor:local
    build:
      context: .
    env_file: .env
    environment:
      POSTGRES_USER: pactor_owner
      POSTGRES_PASSWORD: ${PACTOR_OWNER_PASSWORD}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    command: ["celery", "-A", "pactor", "worker", "--loglevel=INFO", "--queues=default,notifications", "--concurrency=2", "--hostname=default@%h"]

  worker-integrations:
    <<: *app
    command: ["celery", "-A", "pactor", "worker", "--loglevel=INFO", "--queues=integrations", "--concurrency=2", "--hostname=integrations@%h"]

  worker-extraction:
    <<: *app
    command: ["celery", "-A", "pactor", "worker", "--loglevel=INFO", "--queues=extraction", "--concurrency=1", "--max-tasks-per-child=20", "--hostname=extraction@%h"]
    mem_limit: 768m
    pids_limit: 128

  scheduler:
    <<: *app
    command: ["celery", "-A", "pactor", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

volumes:
  postgres-data:
  rabbitmq-data:
  clamav-data:
  media:
