[project]
name = "pactor"
version = "0.1.0.dev0"
description = "Plataforma SaaS B2B multitenant para gestão do ciclo de vida de contratos."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "argon2-cffi==25.1.0",
    "celery==5.7.0",
    "django==5.2.19",
    "django-allauth[headless,mfa]==65.22.1",
    "django-csp==4.0",
    "django-filter==26.2",
    "django-oauth-toolkit==3.4.1",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "gunicorn==27.0.1",
    "httpx==0.28.1",
    "kombu==5.7.0",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.9",
    "pypdf==7.1.1",
    "python-docx==1.2.0",
    "python-json-logger==4.2.0",
    "redis==8.1.0",
    "reportlab==5.1.0",
    "tzdata==2026.6",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "celery-types==0.26.0",
    "django-stubs==5.2.9",
    "django-stubs-ext==5.2.9",
    "djangorestframework-stubs==3.16.9",
    "hypothesis==6.170.17",
    "mutmut==3.8.1",
    "mypy==1.19.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.6",
    "types-reportlab==5.1.0.20261104",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pactor"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["frontend", "src/pactor/**/migrations"]

[tool.ruff.lint]
select = [
    "A", "ARG", "B", "BLE", "C4", "DJ", "DTZ", "E", "EM", "ERA", "F", "FBT", "G",
    "I", "ISC", "LOG", "N", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF",
    "S", "SIM", "SLF", "T10", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = [
    # Conflitam com o formatador do Ruff.
    "ISC001",
    # Mensagens de exceção do domínio são curtas e específicas; exigir variável
    # intermediária em todas prejudica a legibilidade.
    "TRY003", "EM101", "EM102",
    # Django, DRF e pytest inspecionam anotações em tempo de execução; mover
    # importações para blocos TYPE_CHECKING causa falhas sutis nessas camadas.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.per-file-ignores]
# Testes usam assert do pytest, valores fixos e acessam membros internos de
# objetos de teste de forma deliberada.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "SLF001", "ARG001", "FBT001"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.isort]
known-first-party = ["pactor"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: estrito em todo o pacote; fronteiras Django usam o plugin de stubs.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_any_explicit = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["src/pactor/.*/migrations/"]

[[tool.mypy.overrides]]
# Fronteiras Django/DRF: o código da aplicação é estrito, mas as classes base
# do framework expõem `Any` em suas assinaturas (ex.: Serializer.validate,
# APIView.dispatch). Exigir ausência total de `Any` explícito nessas camadas
# obrigaria anotações falsas; o restante do modo estrito continua ativo.
module = [
    "pactor.*.api",
    "pactor.*.api.*",
    "pactor.*.admin",
    "pactor.*.serializers",
    "pactor.config.*",
]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Bibliotecas sem stubs publicados; o uso fica encapsulado em adaptadores.
module = ["pypdf.*", "docx.*", "allauth.*", "oauth2_provider.*", "csp.*", "pythonjsonlogger.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "pactor.config.settings"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pactor.config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
# Avisos viram erros. A única exceção: o WhiteNoise avisa quando STATIC_ROOT
# ainda não foi gerado por collectstatic, o que é esperado na suíte de testes.
filterwarnings = ["error", "ignore:No directory at:UserWarning"]
markers = [
    "unit: regras puras, sem banco, broker, cache ou rede",
    "db: exige PostgreSQL real",
    "concurrency: disputa entre conexões ou processos separados",
    "infra: exige RabbitMQ, Redis e worker Celery reais",
    "external: exige credenciais de provedores externos",
]

[tool.coverage.run]
branch = true
source = ["src/pactor"]
omit = ["src/pactor/*/migrations/*", "src/pactor/config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.bandit]
exclude_dirs = ["tests", "frontend"]

[tool.mutmut]
paths_to_mutate = [
    "src/pactor/approvals/domain.py",
    "src/pactor/access/policies.py",
    "src/pactor/contracts/domain.py",
    "src/pactor/deadlines/calendar.py",
    "src/pactor/finance/money.py",
]
tests_dir = ["tests/unit"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]

# ---------------------------------------------------------------------------
# Gates de cobertura por escopo (verificados por scripts/check_coverage.py).
# "core" reúne regras de negócio e casos de uso; "critical" reúne caminhos em
# que um desvio compromete isolamento, integridade documental ou dinheiro.
# ---------------------------------------------------------------------------
[[tool.pactor.coverage-gates]]
name = "core"
include = [
    "src/pactor/*/domain.py",
    "src/pactor/*/domain/*.py",
    "src/pactor/*/services.py",
    "src/pactor/*/services/*.py",
    "src/pactor/*/policies.py",
    "src/pactor/*/calendar.py",
    "src/pactor/*/money.py",
    "src/pactor/core/*.py",
]
exclude = ["src/pactor/core/health.py"]
min_lines = 95.0
min_branches = 90.0
